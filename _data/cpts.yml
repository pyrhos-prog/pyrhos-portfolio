# Roadmap de preparación hacia la certificación Hack The Box CPTS
# (Certified Penetration Testing Specialist) - Job Role Path: Penetration Tester
#
# Cada sección clasifica las máquinas según los dominios de evaluación de la CPTS:
# fundamentos, explotación avanzada, Active Directory y pivoting/redes internas.
#
# Si existe un post con `machine: <name>` y `platform: HackTheBox`, se enlaza
# automáticamente y se marca como Resuelta.

platform: "HackTheBox"
sections:
